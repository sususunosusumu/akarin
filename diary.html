<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>日々の記録｜akarin</title>
<style>
:root{--ink:#283d38;--muted:#61736b;--green:#285f50;--line:#d9e1d9}*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:var(--ink);font:16px/1.85 system-ui,-apple-system,"Hiragino Sans",sans-serif}a{color:var(--green)}header{background:#fffefb;padding:18px max(5vw,20px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;text-decoration:none}nav{display:flex;gap:20px;flex-wrap:wrap}main{max-width:960px;margin:auto;padding:40px 24px}h1{font-size:36px;line-height:1.4}h2{font-size:21px}h3{font-size:16px;margin:18px 0 4px}.lead,.meta{color:var(--muted)}.eyebrow{letter-spacing:.12em;font-size:12px;font-weight:800;color:var(--green)}.filters{display:flex;gap:14px;flex-wrap:wrap;background:#fffefb;border:1px solid var(--line);border-radius:14px;padding:20px;margin:28px 0 18px}label{display:flex;flex-direction:column;font-size:13px;gap:4px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px;background:white;color:var(--ink)}button{cursor:pointer;align-self:end}input[type=search]{min-width:220px}.entry,.empty{background:#fffefb;border:1px solid var(--line);padding:26px;border-radius:16px;margin:20px 0}.entry h2{margin:8px 0}.tag{background:#e8efe7;color:var(--green);font-size:12px;padding:3px 9px;border-radius:16px;display:inline-block;margin:2px 6px 2px 0}.fact{border-left:3px solid #9ab5a4;padding-left:14px;margin:12px 0}.fact p{margin:4px 0;white-space:pre-wrap}.source{font-size:12px;color:var(--muted)}.follow{background:#f8f0dd;padding:12px 18px;border-radius:8px}.count{font-size:14px;color:var(--muted)}details{margin-top:28px}summary{cursor:pointer;font-weight:700}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #bc8035;outline-offset:3px}@media(max-width:600px){main{padding:24px 18px}.filters{display:grid;grid-template-columns:1fr 1fr}label:first-child{grid-column:1/-1}input{min-width:0;width:100%}.entry{padding:20px}h1{font-size:29px}}@media print{.filters,nav,details{display:none}.entry{break-inside:avoid}body{background:white}}
</style></head><body><header><a class="brand" href="learning.html">akarin / 学びと生活</a><nav><a href="learning.html">指導計画・資料</a><a href="index.html">予定ボード</a></nav></header>
<main><p class="eyebrow">DAILY NOTES</p><h1>日々の記録</h1><p class="lead">学校でのこと、家でのこと。その日の出来事と、気づきを少しずつ。</p>
<div class="filters"><label>言葉で探す<input id="query" type="search" placeholder="例：入浴、PECS、切り替え"></label><label>開始日<input id="from" type="date"></label><label>終了日<input id="to" type="date"></label><label>場面<select id="setting"><option value="">すべて</option><option value="school">学校</option><option value="home">家庭</option><option value="dormitory">寄宿舎</option><option value="other">その他</option></select></label><button id="reset" type="button">条件をクリア</button></div>
<p id="count" class="count" role="status" aria-live="polite">記録を読み込んでいます。</p><div id="entries"></div>
<details><summary>チャットから記録を追加するには</summary><p>新しいチャットで「GitHubの sususunosusumu/akarin の records/README.md を読んで、日々の記録を追加して」と伝え、日付と出来事を話してください。</p><p>学校からの連絡・家庭での観察・気づきを整理し、リポジトリに保存します。この画面は保存済みの記録を読むためのページです。</p><p><a href="https://github.com/sususunosusumu/akarin/blob/main/records/README.md">記録の手順を見る</a></p></details></main>
<script>
'use strict';
const labels={school:'学校',home:'家庭',dormitory:'寄宿舎',other:'その他'};let entries=[];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function list(items,parent){if(!items.length)return;const ul=el('ul');for(const item of items)ul.append(el('li',item));parent.append(ul)}
function draw(){const q=document.getElementById('query').value.trim().toLowerCase(),from=document.getElementById('from').value,to=document.getElementById('to').value,setting=document.getElementById('setting').value;const target=document.getElementById('entries');target.replaceChildren();if(from&&to&&from>to){document.getElementById('count').textContent='開始日は終了日以前にしてください。';return}const filtered=entries.filter(e=>(!from||e.date>=from)&&(!to||e.date<=to)&&(!setting||e.observations.some(o=>o.setting===setting))&&(!q||JSON.stringify([e.title,e.summary,e.observations,e.reflections,e.follow_up,e.tags]).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.created_at.localeCompare(a.created_at));document.getElementById('count').textContent=`${filtered.length}件 / 全${entries.length}件`;
if(!filtered.length){const empty=el('section',undefined,'empty');empty.append(el('h2',entries.length?'条件に合う記録はありません':'最初の記録を待っています'),el('p',entries.length?'日付や検索の条件を変えてみてください。':'チャットで日付と出来事を伝えると、ここに記録を積み重ねられます。まだ日々の記録は登録していません。'));target.append(empty);return}
for(const e of filtered){const card=el('article',undefined,'entry');card.id='entry-'+e.id;const time=el('time',e.date);time.dateTime=e.date;card.append(time,el('h2',e.title),el('p',e.summary));for(const tag of e.tags)card.append(el('span',tag,'tag'));card.append(el('h3','出来事・観察'));for(const o of e.observations){const f=el('div',undefined,'fact');f.append(el('strong',labels[o.setting]||'その他'),el('p',o.text),el('p',o.source,'source'));card.append(f)}if(e.reflections.length){card.append(el('h3','気づき・考え'));for(const r of e.reflections){card.append(el('p',r.text),el('p',r.source,'source'))}}if(e.follow_up.length){const f=el('div',undefined,'follow');f.append(el('h3','次に確認・相談したいこと'));list(e.follow_up,f);card.append(f)}card.append(el('p','記録ID：'+e.id+' / 更新：'+e.updated_at.slice(0,10),'source'));target.append(card)}}
for(const id of ['query','from','to','setting'])document.getElementById(id).addEventListener('input',draw);document.getElementById('reset').addEventListener('click',()=>{for(const id of ['query','from','to','setting'])document.getElementById(id).value='';draw()});
async function start(){try{const r=await fetch('records/entries.json',{cache:'no-store'});if(!r.ok)throw Error('load');const data=await r.json();if(data.schema_version!==1||!Array.isArray(data.entries))throw Error('format');entries=data.entries;for(const e of entries){if(typeof e.id!=='string'||typeof e.title!=='string'||typeof e.summary!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!['observations','reflections','follow_up','tags'].every(k=>Array.isArray(e[k]))||typeof e.created_at!=='string'||typeof e.updated_at!=='string')throw Error('format')}draw()}catch(e){document.getElementById('count').textContent='記録を読み込めませんでした。時間をおいて再読み込みしてください。';document.getElementById('entries').replaceChildren()}}start();
</script></body></html>
