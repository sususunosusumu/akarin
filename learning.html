<template id="home"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">LEARNING & DAILY LIFE</p><h1>できることを、<br>少しずつ。</h1><p class="lead">学びと生活を支える計画を、資料ごとに見渡せる場所。記録された姿と、これからの目標を分けて整理しました。</p><div class="notice">前期B表の原本は未確認、後期の評価欄は未記入です。</div><div class="grid">
<article class="card"><span class="tag">01 / 実態と願い</span><h3><a href="#a">個別の指導計画 A表 →</a></h3><p>本人の願い、得意なこと、生活の手掛かり。</p></article>
<article class="card"><span class="tag">02 / 振り返り</span><h3><a href="#first">前期の成果 →</a></h3><p>後期資料の振り返りから確認できる範囲。</p></article>
<article class="card"><span class="tag">03 / 寄宿舎</span><h3><a href="#b">B表・後期の計画 →</a></h3><p>気持ちを伝えること、体を洗うこと。</p></article>
<article class="card"><span class="tag">04 / 学校</span><h3><a href="#school">個別の指導計画・後期 →</a></h3><p>日常生活、学習、作業、行事のねらい。</p></article></div><article class="card" style="margin-top:20px"><span class="tag">DAILY NOTES</span><h3><a href="diary.html">日々の記録 →</a></h3><p>学校・家庭・寄宿舎での出来事を、日付ごとに振り返る。</p></article><h2>支援をつなぐ3つの軸</h2><div class="point">意思を伝える ／ 見通しを持つ ／ 自分でできた経験を重ねる</div><p class="source">上の3つの軸は資料を横断した整理・解釈です。学校の原文ではありません。</p></template>
<template id="a"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">01 / A表</p><h1>実態と、みんなの願い</h1><span class="tag">資料の記載要約</span><h2>願い</h2><ul><li>本人の願い欄：寄宿舎で楽しく生活したい。</li><li>保護者：集団生活のルールを身に付け、身の回りのことができるようになってほしい。</li><li>担任：自分でできることを増やしてほしい。</li><li>寄宿舎担当：仲間を意識し、互いが気持ちよく暮らす力を育てたい。入浴をやり遂げる経験を自信につなげたい。</li></ul><h2>記録された姿</h2><div class="grid"><article class="card"><h3>見て分かる手掛かり</h3><p>時刻の文字提示、タイマー、回数の提示を手掛かりに行動する場面がある。数字・かな文字を使う姿も記録されている。</p></article><article class="card"><h3>気持ちを伝える</h3><p>PECSのカードを指さし、言葉も添えて要求を伝える。職員の顔写真を使う場面もある。</p></article><article class="card"><h3>身の回りのこと</h3><p>入浴準備は手順表なしでもできる。洗う動作は手順表、声がけ、数える支援、手本を使って取り組む。</p></article><article class="card"><h3>好きなこと・得意なこと</h3><p>音楽、映像、アルバム等から余暇を選ぶ。家庭で画像を選び、切り貼りして制作するとの記載。決まった量のプリントへ集中する姿もある。</p></article></div><h2>可能性の芽〈学校の見立て〉</h2><p>視覚的な提示と繰り返し、手本、好きな活動の選択が、理解や自分から取り組む力につながりそうだと整理されている。</p><div class="point"><strong>見るポイント〈今回の整理〉</strong><br>「何ができたか」に加え、「どんな手掛かりがあるとできたか」を残す。実態と可能性を区別する。</div><p class="source">出典：S5・S6・S7。A表の観察期間は個々に明記されていないため、全てを前期の評価とは扱いません。</p><section class="detail"><p class="eyebrow">DETAILS</p><h2>詳しい記録と確認ポイント</h2><h3>A表に記載された願い【記載事実】</h3><ul><li><strong>本人のねがい</strong>：「寄宿舎で楽しく生活したい」。本人の願い欄の記載であり、本人への聞き取り方法や確認手順は画像では分からない。</li><li><strong>保護者の願い</strong>：集団生活のルールを身に付けてほしい。例として、友だちの物を取らない、リモコンを独占しない、友だちの布団に入らない、廊下を走らない、が挙げられている。自分の身の回りのことができるようになってほしい。</li><li><strong>学級担任の願い</strong>：自分でできることを増やしてほしい。</li></ul><p>出典：S5。</p><h3>寄宿舎担当の願い・支援の方向【学校の見立て】</h3><ul><li>気になる物事があると同意を得る前に行動し、トラブルになることがある。仲間を意識する力を育て、互いが気持ちよく暮らせるルール・マナーを身に付けてほしい。</li><li>前期の洗髪の経験を踏まえ、後期は体洗いへ進み、入浴全体を自分でやり遂げる経験を重ねてほしい。「一人でできた」という実感を自信につなげたい。</li><li>PECSで自分の気持ちを表し、約束を決めて気持ちの折り合いを付けられるようにする。</li><li>手順表にイラストや数字を入れ、見て捉えやすくする。</li><li>洗髪・体洗い・洗顔を一連の流れとして定着させる。</li></ul><p>出典：S7。「同意前の行動がある」という観察と、「仲間を意識する力を育てたい」という願いを区別する。</p><h3>4-1. 入浴・身の回りのこと</h3><p><strong>【記載事実：すがた】</strong>（S5）</p><ul><li>入浴に必要な物は、手順表を見なくても準備できる。</li><li>洗髪では手順表を使用し、職員の言葉がけや指さしで手を動かす。「10秒動かすよ」と伝えられ、職員と一緒に数えながら洗う。</li><li>くしは「10回とかすよ」という言葉がけを受けて動かす。</li><li>洗い流しでは、職員が数えている間シャワーを当てられる。</li><li>体洗いでは、手順表・言葉がけ・部位の指さしがあると、示された部位をさっと1回なでる。</li><li>足指は片足を膝に載せ、職員の手本を見ることで指の間を洗う。</li><li>洗顔では手をお椀の形にして水をため、「ジャブジャブ」の声がけで洗う。顔に泡が付くことは苦手と記載。</li><li>洗い終えた際、職員の「オッケー」に応じて本人も「オッケー」と言う。</li></ul><p><strong>【学校の見立て：可能性の芽】</strong>（S5）</p><ul><li>毎日繰り返すことで定着し、自分から取り組む力につながりそう。</li><li>手順表、数字、数える支援、動作の手本が分かりやすさにつながりそう。</li><li>泡は苦手でも、お湯だけなら顔がぬれることはよさそう。</li><li>「オッケー」が「ここまでできた」という区切りとして伝わりそう。</li></ul><p><strong>【整理・解釈】</strong>「準備が自分でできる」「手掛かりがあれば洗う動作ができる」「十分な洗い方が身に付いている」は別段階である。体洗いが一度なでる動きにとどまるという記録から、後期は洗う場所だけでなく動作や回数を分かりやすくする余地がある。独力で入浴全体が完成したとは読み取れない。</p><h3>4-2. 時間・予定・活動の切り替え</h3><p><strong>【記載事実】</strong>（S6・S7）</p><ul><li>ホワイトボードに「7:35かたづけ、7:40しょくどう」と書かれると、言葉がけなしでも時計を見て自分で行動する。</li><li>タイムタイマーが鳴ると、終わりの合図として次の行動に移る。</li><li>「10回」と伝えられ、職員が数えると終わりが分かる。</li><li>入舎当時、寄宿舎の余暇グッズを学校へ持って行きたい気持ちの切り替えに1時間要したことがある。約束をイラストで見るようになって以降、そのような姿は見られていないと記録されている（S6末尾からS7冒頭への続き）。</li></ul><p><strong>【学校の見立て】</strong> 時間や予定を事前に視覚提示すると見通しを持って切り替えられそう。回数や時間を数字で示すと分かりやすそう。（S6・S7）</p><p><strong>【整理・解釈】</strong> 記録上の成功場面を、全ての切り替えが自立したという評価に広げない。どの提示と場面でできたかを残すことが有用。</p><h3>4-3. ルール・安心して過ごすための環境</h3><p><strong>【記載事実】</strong>（S6・S7）</p><ul><li>夜間に起きて照明を付けることがあった。スイッチカバーを付け、取らない約束をすると、照明を付ける姿は見られなくなった。</li><li>夜間、同室の仲間の布団へ入ることがあった。資料では「寂しさからか」と推測が添えられている。抱き枕を使用してから自分の布団で眠れるようになった。</li><li>火災報知器を鳴らすことがあった。紙でボタンを見えなくすると、気にしなくなったと記録されている。</li><li>気になる部屋や棚について、相手の同意を得る前に入室・開閉することがある。</li><li>仲間が見ているテレビのチャンネルを変え、トラブルになることがあった。リモコンを手放せない時もあるが、置き場所を決めると穏やかに見られることがある。</li></ul><p><strong>【学校の見立て】</strong> 約束や安心グッズ、見え方の調整、自分の気持ちを先に伝える経験がルール・マナーにつながりそう。（S6・S7）</p><p><strong>【整理・解釈】</strong> 抱き枕等による安心と、仲間の空間を尊重する支援の両方が記録されている。「寂しさ」が原因と確定したわけではない。報知器の記述は当時の対応記録であり、家庭等で同じ設備対応を行うための推奨ではない。</p><h3>4-4. 余暇・得意なこと・学習</h3><p><strong>【記載事実】</strong>（S6）</p><ul><li>メロディーブック、DVD『魔女の宅急便』、ピアノ、テレビ、自作の写真アルバムなど、したいことを自分で選び、一人で見て過ごす。</li><li>リモコンでテレビをEテレ（2番）に変えて見る。</li><li>家庭では印刷したい画像を自分で選んで印刷し、はさみとセロハンテープで切り貼りしてアルバムを作るとの記載がある。学校文書内に記された家庭での情報であり、今回家庭へ直接確認したものではない。</li><li>毎日19:20から勉強時間として、数字の点つなぎ、図形や文章の視写、迷路等に取り組む。決まった3枚分は集中して机に向かう。</li></ul><p><strong>【学校の見立て】</strong> 好きな活動へ意欲的に取り組めそう。職員が隣にいなくても余暇を過ごせそう。手先の器用さを細かな作業に生かせそう。時間と枚数を固定すると学習に集中できそう。（S6）</p><h3>4-5. 理解・表出・関わり</h3><p><strong>【記載事実】</strong>（S7）</p><ul><li>数字・ひらがな・カタカナへの理解があり、見たいYouTubeを文字入力して検索する。</li><li>PECSは主に自分の要求を伝える際に使用。「○○」「ください」のカードを指さし、言葉でも伝える。例：DVD、メロディーブック、ピアノ、本（アルバム）。</li><li>教室では職員の顔写真を使ってPECSを使用する。</li><li>エプロンたたみで職員の「オッケー」を聞き、本人も返事をする。別の日には、たたみ終えた後、本人から「オッケー」と話す姿があった。</li></ul><p><strong>【学校の見立て】</strong> PECSの語句を増やすと気持ちを伝える幅が広がりそう。仲間や職員の顔写真を使うと仲間との生活を意識するきっかけになりそう。「オッケー」で達成の喜びを共有できそう。（S7）</p><p><strong>【整理・解釈】</strong> 既に指さしと発語を併用している。後期の「3語文」は目標であり、現在いつでも3語文で伝えられるという成果ではない。原資料には3語文の具体的な完成例やPECSの段階は記されていない。</p></section></template>
<template id="first"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">02 / 前期</p><h1>前期からの積み重ね</h1><div class="notice">前期B表そのものは、今回の画像9枚では確認できません。正式な前期目標・全項目の評価は補わず、後期資料で明示された振り返りを示します。</div><article class="card"><span class="tag">前期の成果として明記</span><h2 style="margin-top:0">洗髪へ取り組んだ経験</h2><p>寄宿舎担当の記述では、前期に洗髪へ取り組み、手順表を意識しながら自分の力で洗える場面が増えたとされています。</p><p class="source">出典：S7「寄宿舎担当のねがい」。入浴全体が独力で完成したという記録ではありません。</p></article><h2>後期へどうつながるか</h2><p>後期は体洗いへ進み、イラスト・数字の手順表と手本を使いながら、洗髪・体洗い・洗顔の流れを定着させる計画です。</p><div class="point"><strong>確認したいこと〈今回の整理〉</strong><br>前期B表が追加されたら、目標・手だて・評価を対応させて追記する。時計やタイマー等の成功記録も、観察時期を確認して扱う。</div><p><a href="#b">後期の寄宿舎計画を見る →</a></p><section class="detail"><p class="eyebrow">DETAILS</p><h2>詳しい記録と確認ポイント</h2><h3>明示された前期の成果【記載事実】</h3><p>S7の寄宿舎担当の願いには、前期に入浴時の洗髪へ取り組み、手順表を意識しながら自分の力で洗える場面が増えたとある。これが今回確認できる、前期という時期を明示した成果である。</p><p>A表にある時計・タイマー・約束・抱き枕等による変化は重要な生活記録だが、それぞれの観察日や評価期間は記載されていないため、全てを「前期評価」とは扱わない。</p><h3>未確認事項</h3><ul><li>前期B表の正式な重点目標、全ての手だて、評価、総合所見。</li><li>前期の学校での教科・活動別目標と成果。</li><li>各場面の頻度、成功率、必要な援助量の定量的記録。</li></ul><p>前期資料が追加された場合は、原文の目標・手だて・評価を対応させて追記する。後期の計画を遡って前期の目標として記入しない。</p></section></template>
<template id="b"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">03 / 寄宿舎 B表・後期</p><h1>伝えること、洗うこと。</h1><div class="notice">以下は後期の計画です。評価欄・総合所見は未記入です。</div><article class="card"><span class="tag">重点目標 1</span><h2 style="margin-top:0">PECSで自分の気持ちを伝える</h2><ul><li>「テレビ」「みたい」「おねがいします」等の語句を増やし、一緒に確認する。</li><li>やりたい時に仲間へ伝えられるよう、職員が言葉がけ・指さしをする。</li><li>共有の部屋では「いれて」、やり取りの後には「ありがとう」を支える。</li><li>仲間と話し合い、時間や約束をタイマー・ホワイトボードで示す。</li></ul><div class="point">確認ポイント〈整理〉：自分から伝えたか、どの援助があったか。相手の返事を待つことや、希望がかなわない時の代案も相談したい。</div></article><article class="card" style="margin-top:20px"><span class="tag">重点目標 2</span><h2 style="margin-top:0">手順表を見ながら体を洗う</h2><ul><li>イラスト・数字の手順表を作り、職員が手本を示して一緒に動作を確認する。</li><li>洗顔では「ジャブジャブ」と声をかける。</li><li>流れが定着したら、必要な声がけ・指さしで見守り、「オッケー」で区切る。</li><li>家庭へ手順表を渡し、連絡帳で双方の様子を共有する。</li></ul><div class="point">確認ポイント〈整理〉：洗う部位・動作・回数、必要な援助、苦手さや負担。家庭でも同じ手掛かりが使えるか。</div></article><p class="source">出典：S9。S8にも同じ重点目標2項目の記載。</p><section class="detail"><p class="eyebrow">DETAILS</p><h2>詳しい記録と確認ポイント</h2><p>出典：S9。S8にも同じ重点目標2項目が記載されている。</p><h3>目標1：やりたいことがあった時、PECSで自分の気持ちを伝える</h3><p><strong>【記載事実：計画】</strong></p><ul><li>自分の気持ちを表す語句を増やす。例：「テレビ」「みたい」「おねがいします」。増やした語句は本人と一緒に確認する。</li><li>やりたいことが生じた時、仲間へPECSで伝えられるよう職員が言葉がけや指さしを行う。</li><li>想定場面は、テレビを見たい時、仲間の持ち物が気になる時、気になる部屋や棚がある時など。</li><li>共有の部屋に仲間がいる時は、「いれて」と伝えられるよう言葉がけをする。</li><li>仲間と話し合った後、内容に応じて時間や約束を伝える。タイムタイマーとホワイトボードを使用する。</li><li>仲間に「ありがとう」を伝えられるよう職員が言葉がけをする。</li></ul><p><strong>【整理・解釈】</strong> 要求を伝えるだけでなく、相手と相談し、時間や使い方を決めるところまでを含む計画。ただし相手が断った場合の代案や、本人が困った・嫌だと伝える方法は具体的に書かれていない。</p><h3>目標2：手順表を見ながら体を洗う</h3><p><strong>【記載事実：計画】</strong></p><ul><li>イラストと数字を使う体洗いの手順表を作成する。</li><li>手順表に沿い、職員が手本を示し、一緒に動きを確認しながら洗う。</li><li>洗顔では「ジャブジャブ」と声をかける。</li><li>流れが定着してきたら、必要に応じて言葉がけや指さしをしながら見守り、「オッケー」と声をかける。</li><li>家庭にも手順表を渡し、同じように取り組めるようにする。連絡帳で家庭・寄宿舎双方の様子を共有する。</li></ul><p><strong>【評価の状態】</strong> S9の両目標の評価欄と後期総合所見は空欄。達成済みとは記載しない。</p><p><strong>確認したいポイント【整理・解釈】</strong> 洗う部位・動作・回数の基準、どの援助でできたか、本人の負担や嫌がる様子、家庭用手順表の共有方法を確認すると振り返りやすい。</p></section></template>
<template id="school"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">04 / 学校 B表②・後期</p><h1>学びの場面と、手掛かり</h1><article class="card"><span class="tag">長期目標〈計画〉</span><ol><li>PECSで相手に3語文で要求を伝える。</li><li>スケジュールに沿って活動を切り替えて行動する。</li></ol></article><div class="notice">評価欄は未記入。3語文や活動の達成を示す評価ではありません。</div><h2>日常生活</h2><ul><li><strong>身だしなみ：</strong>服装を整える。イラストと、手伝いを求めるPECSのチップを用意する。</li><li><strong>保健係：</strong>各教室へカードを配る。クラス表示を確認し、初めは職員が同行する。</li><li><strong>掃除：</strong>休み時間から切り替え、自分の範囲を雑巾がけする。タイマー、床のテープ、手本を使う。慣れたら本人のタイマー設定も支える。</li></ul><h2>学習・活動</h2><ul><li><strong>木工：</strong>したい活動を見つける。工程の異なる作業を選べるようにし、当日分をかごに用意する。</li><li><strong>調理の手順表づくり：</strong>活動を切り替え、印刷物の切り貼りで手順表を作る。</li><li><strong>キックベース：</strong>相手の陣地へ蹴る。手本と「3個蹴る」等の具体的回数を示す。</li><li><strong>リトミック：</strong>音楽に合わせて身体を動かし演奏する。歌と複数の楽器を用意する。</li><li><strong>調理実習：</strong>器具を正しく扱う。安全な使い方と工程を動画・イラスト・手本で示す。</li><li><strong>制作：</strong>紙や木を道具で加工する。複数の制作物と、手本・動画を用意する。</li><li><strong>作業：</strong>予定した内容に最後まで取り組む。やることリストと当日分の材料を提示する。</li><li><strong>学校行事：</strong>購入品を正しく渡す。品物をまとめるかごと安心できるグッズを用意する。</li><li><strong>宿泊学習：</strong>係の仕事に取り組む。役割を写真・文字・イラストで示す。</li><li><strong>自立活動：</strong>内容を理解して自発的に取り組む。スケジュール、手本、複数の選択肢を用意する。</li></ul><div class="point"><strong>見るポイント〈今回の整理〉</strong><br>自分で選ぶ／終わりと次が分かる／必要な時に助けを求める。活動ごとに支援がどれだけ必要だったかを見る。</div><p class="source">出典：S2・S3・S4。行事の固有名は省略・一般化しています。</p><section class="detail"><p class="eyebrow">DETAILS</p><h2>詳しい記録と確認ポイント</h2><p>出典：S2・S3・S4。寄宿舎B表と混同しない。</p><h3>長期目標【記載事実：計画】</h3><ul><li>PECSを使って相手に3語文で要求を伝える。</li><li>スケジュールに沿って活動を切り替えて行動する。</li></ul><h3>日常生活の指導</h3><div class="table-scroll"><table><tr><th>場面</th><th>ねらい</th><th>主な手だて</th><th>要点・確認点（整理・解釈）</th></tr><tr><td>身だしなみ</td><td>服装を整える</td><td>ズボンが下がった時に上げることを示すイラスト。手伝いが必要な時にPECSで意思表示できるチップを準備</td><td>自分で直せる場面と、助けを求める場面を両方見る</td></tr><tr><td>保健係</td><td>元気調べカードを各教室に配る</td><td>ファイルと教室のクラス名表示を一緒に確認。初めは同行し、見る場所を指さす</td><td>表示を頼りに配れるか。同行・指さしがどこまで必要か</td></tr><tr><td>掃除</td><td>休み時間から切り替え、自分の範囲を雑巾がけする</td><td>終了タイマー。慣れたら押す場所を示し「5回押して」で本人が設定。床のテープで範囲を示し、初めは手本</td><td>切り替え、設定、清掃範囲の理解を分けて確認</td></tr></table></div><p>S2。教科等は、身だしなみが保健体育・自立活動3、保健係が社会・自立活動2、掃除が職業・家庭・自立活動2・3。</p><h3>生活単元学習・教科別学習</h3><div class="table-scroll"><table><tr><th>場面</th><th>ねらい</th><th>主な手だて</th><th>要点・確認点（整理・解釈）</th></tr><tr><td>学校行事に向けて（木工）</td><td>木工作業でやりたい活動を見つけて取り組む</td><td>工程の異なる作品や「きる・やする・ぬる」等の作業を用意。1つの活動に集中できるようにする。当日分を事前にかごへ</td><td>選択と取り組む量の見通しを支える</td></tr><tr><td>収穫祭</td><td>活動を切り替えて調理の手順表を作る</td><td>印刷物や画用紙を用意し、手順を切り貼りで作れるようにする</td><td>調理をする目標と手順表を作る目標を区別</td></tr><tr><td>キックベース</td><td>自分の陣地のボールを相手の陣地へ蹴る</td><td>蹴り方の手本。取り組みやすくするため「3個蹴る」等の具体的回数</td><td>回数と動きが分かるか、参加を楽しめるか</td></tr><tr><td>リトミック</td><td>音楽に合わせて身体を動かし、楽器で演奏する</td><td>リトミック・手遊び歌を準備。複数の楽器から選べるようにする</td><td>好きな表現や楽器の選択を生かす</td></tr></table></div><p>S2・S3。</p><h3>課題別学習・総合的な学習・特別活動・自立活動</h3><div class="table-scroll"><table><tr><th>場面</th><th>ねらい</th><th>主な手だて</th><th>要点・確認点（整理・解釈）</th></tr><tr><td>調理実習</td><td>調理器具を正しく扱い、実習に取り組む</td><td>動画・イラストで安全な使用法を説明。初めに手本。一連の工程を動画で用意</td><td>器具の扱いと工程の理解を確認</td></tr><tr><td>せいさく</td><td>紙や木を道具で加工し作品を作り上げる</td><td>複数の制作物。道具の使い方を手本や動画で示す</td><td>得意な切り貼り等と安全な道具操作をつなぐ</td></tr><tr><td>作業</td><td>予定した内容に最後まで取り組む</td><td>ホワイトボードでやることリスト。当日分をかごへ用意</td><td>「最後」が分かる量と提示になっているか</td></tr><tr><td>学校行事当日</td><td>お客さんが買った物を正しく渡す</td><td>購入品をまとめて入れるかご。安心できるグッズ</td><td>渡す品物の区別と安心して参加する条件</td></tr><tr><td>宿泊学習</td><td>自分の役割を理解し、係の仕事に取り組む</td><td>顔写真と「きる」「はる」等の内容を文字・イラストで示す</td><td>誰が何をするかを確認できるか</td></tr><tr><td>自立活動</td><td>活動内容を理解し自発的に取り組む</td><td>自分で確認できるスケジュール表、手本、複数の活動からの選択</td><td>自分で選ぶ・始めるための手掛かりがあるか</td></tr></table></div><p>出典：S3。原資料の指導内容には、作業の持続性・巧緻性、視覚支援や言葉がけを頼りにした行動、絵カード・写真・スケジュール表・タイマーを用いた手順の理解と切り替え、安全な調理、役割理解、基本的な運動等が対応付けられている。</p><p><strong>【評価の状態】</strong> S2～S4の確認できる評価欄は空欄。以上はいずれも計画であり、実施・達成の記録ではない。</p></section></template>
<template id="comments"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">05 / 保護者コメント案</p><h1>後期の計画へ添える言葉</h1><p class="lead">以下は今回作成した提案です。保護者が既に述べた意見や提出済みのコメントではありません。</p><h2>気持ちを伝える</h2><blockquote>やりたいことをPECSで伝える経験を増やしていただきたいです。「てつだって」「いやです」「やすみたい」など、困った時にも伝えられる方法をご相談したいです。相手の返事を待つことや、希望がかなわない時の別の方法も、分かりやすい提示で支えていただけるとありがたいです。</blockquote><h2>体洗い・家庭との共有</h2><blockquote>家庭でも取り組めるよう、同じ手順表と、洗う場所・動かし方・回数の目安を共有していただきたいです。本人の苦手さや様子を見ながら進め、どこを自分でできたか、どの支援が必要だったかを教えていただけると助かります。</blockquote><h2>学校・寄宿舎をつなぐ</h2><blockquote>学校と寄宿舎で使うカードや伝え方を共有し、本人から伝えた場合と、声がけや指さしがあって伝えた場合を分けて様子を教えていただきたいです。切り替えでは、終わりと次の活動が分かる提示をお願いします。</blockquote><p class="source">根拠：S2・S5・S7・S9。拒否や休憩の表出に困っていると原資料に書かれているわけではなく、支援の選択肢としての提案です。</p><section class="detail"><p class="eyebrow">DETAILS</p><h2>詳しい記録と確認ポイント</h2><p>以下は全て<strong>今回の提案</strong>。家庭で確認できていない成果や困りごとは書き加えず、計画へのお願い・相談として記載する。</p><h3>案1：寄宿舎の意思表示・仲間との関わりへ</h3><blockquote>やりたいことをPECSで伝える経験を増やしていただきたいです。「いれて」「ありがとう」に加え、「てつだって」「いやです」「やすみたい」など、困った時や負担がある時にも伝えられる方法をご相談したいです。相手の返事を待つことや、希望がかなわない時に別の方法を選ぶことも、分かりやすい提示で支えていただけるとありがたいです。</blockquote><p><strong>根拠・意図【整理・解釈】</strong> S7・S9の要求表出と同意前の行動を踏まえた提案。拒否や休憩の表出に困っていると原資料に記載されているわけではない。</p><h3>案2：体洗い・家庭との連携へ</h3><blockquote>前期の洗髪の取組を、後期の体洗いにつなげていただきありがとうございます。家庭でも取り組めるよう、同じ手順表と、洗う場所・動かし方・回数の目安を共有していただきたいです。泡などの苦手さや本人の様子を見ながら進め、どの部分を自分でできたか、どの支援が必要だったかを連絡帳で教えていただけると助かります。</blockquote><p><strong>根拠・意図【整理・解釈】</strong> S5の一度なでる動作・泡の苦手さ、S9の手順表共有を具体化する案。「家庭でもできるようになった」という未確認の成果は含めていない。</p><h3>案3：学校の3語文・活動の切り替えへ</h3><blockquote>PECSでの3語文の要求と、スケジュールに沿った切り替えを、本人に分かりやすい形で進めていただきたいです。学校と寄宿舎で使うカードや伝え方を共有し、本人から伝えた場合と、声がけ・指さしがあって伝えた場合を分けて様子を教えていただけるとありがたいです。切り替えでは、終わりと次の活動が分かる提示をお願いします。</blockquote><p><strong>根拠・意図【整理・解釈】</strong> S2の長期目標とS6・S7の視覚提示の記録をつなぐ案。学校と寄宿舎のPECSの使用状況が同じだとは断定しない。</p><h3>余白が少ない場合の短縮案</h3><blockquote>学校・寄宿舎・家庭でカードや手順表を共有し、本人から伝えたこと・自分でできたことと、必要だった支援を教えていただきたいです。苦手さや気持ちにも配慮しながら、「できた」という実感を積み重ねられるようお願いします。</blockquote><p>以下は学校の既定評価項目ではなく、今回の整理としての確認案。</p><div class="table-scroll"><table><tr><th>領域</th><th>記録すると分かりやすいこと</th></tr><tr><td>意思表示</td><td>場面、相手、使ったカード・語句、自発か援助ありか、相手の返事への対応</td></tr><tr><td>入浴</td><td>洗った部位、動作、援助の種類、本人の負担、家庭と寄宿舎での違い</td></tr><tr><td>切り替え</td><td>何から何へ、時刻・タイマー・予定表等の手掛かり、必要な声がけ</td></tr><tr><td>学習・作業</td><td>選んだ活動、予定した量、終わりの理解、安全に道具を扱うための支援</td></tr><tr><td>安心・仲間との生活</td><td>安心につながった物や提示、同意を得るやり取り、本人の希望がどう扱われたか</td></tr></table></div></section></template>
<template id="sources"><p class="source">資料の基準：2026年10月に受け取った資料に基づく整理</p><p class="eyebrow">06 / SOURCES</p><h1>出典と、読み分け</h1><h2>資料の時点</h2><p>各資料は2026年10月に受け取ったものです。2026年10月を資料の基準月とし、ページの更新日とは分けて扱います。個々の出来事の発生日や評価日を、2026年10月と断定するものではありません。コメント案は、この資料を踏まえて作成した提案です。</p><h2>事実・見立て・提案を分ける</h2><ul><li>記載要約：資料で確認できた内容。現在の全ての場面での能力を保証するものではありません。</li><li>学校の見立て：「可能性の芽」「願い」「支援の方向」。成果とは区別します。</li><li>整理・確認ポイント：今回の解釈です。</li><li>コメント案：今回新たに作った提案です。</li></ul><h2>画像と文書の対応</h2><ul><li>S2：IMG_4852.jpg、S3：IMG_4853.jpg、S4：IMG_4854.jpg＝学校後期計画。</li><li>S5：IMG_4855.jpg、S6：IMG_4856.jpg、S7：IMG_4857.jpg＝A表と実態・願い。</li><li>S8：IMG_4858.jpg＝重点目標のみのページ。</li><li>S9：IMG_4859.jpg＝寄宿舎B表・後期。</li><li>S1：IMG_4851.jpg＝入舎希望申込書。Web版には詳細を掲載していません。</li></ul><div class="notice">前期B表の原本は未確認です。過去の会話の回答本文は取得できず、添付画像を根拠に再整理しました。</div></template>
<noscript><p class="notice">計画を表示するにはJavaScriptを有効にしてください。</p></noscript>
<script>
const keys=['home','a','first','b','school','comments','sources'];
const desktop=matchMedia('(min-width:960px)');
const menu=document.getElementById('plan-menu');
menu.open=desktop.matches;
desktop.addEventListener('change',()=>{menu.open=desktop.matches});
menu.addEventListener('toggle',()=>{if(desktop.matches&&!menu.open)menu.open=true});
function render(){
  let id=location.hash.slice(1);if(!keys.includes(id))id='home';
  const main=document.getElementById('content');
  main.replaceChildren(document.getElementById(id).content.cloneNode(true));
  main.querySelectorAll('table').forEach(table=>{
    table.setAttribute('role','table');
    [...table.rows].forEach(row=>{row.setAttribute('role','row');[...row.cells].forEach(cell=>cell.setAttribute('role',cell.tagName==='TH'?'columnheader':'cell'))});
    const labels=[...table.rows[0].cells].map(cell=>cell.textContent);
    [...table.rows[0].cells].forEach(cell=>cell.scope='col');
    [...table.rows].slice(1).forEach(row=>[...row.cells].forEach((cell,i)=>cell.dataset.label=labels[i]));
    table.setAttribute('aria-label',table.parentElement.previousElementSibling.textContent);
  });
  const headings=[...main.querySelectorAll('h2,.detail h3')];
  if(headings.length){
    const toc=document.createElement('details');toc.className='section-menu';
    const summary=document.createElement('summary');summary.textContent='このページの項目へ移動';toc.append(summary);
    const links=document.createElement('div');links.className='section-links';toc.append(links);
    headings.forEach(heading=>{const button=document.createElement('button');button.type='button';button.textContent=heading.textContent;button.addEventListener('click',()=>{toc.open=false;heading.tabIndex=-1;heading.focus({preventScroll:true});heading.scrollIntoView({block:'start'});});links.append(button)});
    const title=main.querySelector('h1');title.after(toc);
  }
  const foot=document.createElement('footer');foot.textContent='akarin / 令和8年度 学びと生活の記録';main.append(foot);
  document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+id){a.setAttribute('aria-current','page');document.getElementById('menu-state').textContent=a.textContent}else a.removeAttribute('aria-current')});
  document.title=main.querySelector('h1').textContent+'｜akarin';
}
window.addEventListener('hashchange',()=>{if(location.hash==='#content'){document.getElementById('content').focus();return}render();if(!desktop.matches)menu.open=false;document.getElementById('content').focus();window.scrollTo(0,0)});
render();
</script></body></html>
