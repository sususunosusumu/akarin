<template id="home"><p class="eyebrow">LEARNING & DAILY LIFE</p><h1>できることを、<br>少しずつ。</h1><p class="lead">学びと生活を支える計画を、資料ごとに見渡せる場所。記録された姿と、これからの目標を分けて整理しました。</p><div class="notice">学校・寄宿舎の資料から、支援内容を要約したページです。氏名・学校名・連絡先・原画像は掲載していません。前期B表の原本は未確認、後期の評価欄は未記入です。</div><div class="grid">
<article class="card"><span class="tag">01 / 実態と願い</span><h3><a href="#a">個別の指導計画 A表 →</a></h3><p>本人の願い、得意なこと、生活の手掛かり。</p></article>
<article class="card"><span class="tag">02 / 振り返り</span><h3><a href="#first">前期の成果 →</a></h3><p>後期資料の振り返りから確認できる範囲。</p></article>
<article class="card"><span class="tag">03 / 寄宿舎</span><h3><a href="#b">B表・後期の計画 →</a></h3><p>気持ちを伝えること、体を洗うこと。</p></article>
<article class="card"><span class="tag">04 / 学校</span><h3><a href="#school">個別の指導計画・後期 →</a></h3><p>日常生活、学習、作業、行事のねらい。</p></article></div><h2>支援をつなぐ3つの軸</h2><div class="point">意思を伝える ／ 見通しを持つ ／ 自分でできた経験を重ねる</div><p class="source">上の3つの軸は資料を横断した整理・解釈です。学校の原文ではありません。</p></template>
<template id="a"><p class="eyebrow">01 / A表</p><h1>実態と、みんなの願い</h1><span class="tag">資料の記載要約</span><h2>願い</h2><ul><li>本人の願い欄：寄宿舎で楽しく生活したい。</li><li>保護者：集団生活のルールを身に付け、身の回りのことができるようになってほしい。</li><li>担任：自分でできることを増やしてほしい。</li><li>寄宿舎担当：仲間を意識し、互いが気持ちよく暮らす力を育てたい。入浴をやり遂げる経験を自信につなげたい。</li></ul><h2>記録された姿</h2><div class="grid"><article class="card"><h3>見て分かる手掛かり</h3><p>時刻の文字提示、タイマー、回数の提示を手掛かりに行動する場面がある。数字・かな文字を使う姿も記録されている。</p></article><article class="card"><h3>気持ちを伝える</h3><p>PECSのカードを指さし、言葉も添えて要求を伝える。職員の顔写真を使う場面もある。</p></article><article class="card"><h3>身の回りのこと</h3><p>入浴準備は手順表なしでもできる。洗う動作は手順表、声がけ、数える支援、手本を使って取り組む。</p></article><article class="card"><h3>好きなこと・得意なこと</h3><p>音楽、映像、アルバム等から余暇を選ぶ。家庭で画像を選び、切り貼りして制作するとの記載。決まった量のプリントへ集中する姿もある。</p></article></div><h2>可能性の芽〈学校の見立て〉</h2><p>視覚的な提示と繰り返し、手本、好きな活動の選択が、理解や自分から取り組む力につながりそうだと整理されている。</p><div class="point"><strong>見るポイント〈今回の整理〉</strong><br>「何ができたか」に加え、「どんな手掛かりがあるとできたか」を残す。実態と可能性を区別する。</div><p class="source">出典：S5・S6・S7。A表の観察期間は個々に明記されていないため、全てを前期の評価とは扱いません。</p></template>
<template id="first"><p class="eyebrow">02 / 前期</p><h1>前期からの積み重ね</h1><div class="notice">前期B表そのものは、今回の画像9枚では確認できません。正式な前期目標・全項目の評価は補わず、後期資料で明示された振り返りを示します。</div><article class="card"><span class="tag">前期の成果として明記</span><h2 style="margin-top:0">洗髪へ取り組んだ経験</h2><p>寄宿舎担当の記述では、前期に洗髪へ取り組み、手順表を意識しながら自分の力で洗える場面が増えたとされています。</p><p class="source">出典：S7「寄宿舎担当のねがい」。入浴全体が独力で完成したという記録ではありません。</p></article><h2>後期へどうつながるか</h2><p>後期は体洗いへ進み、イラスト・数字の手順表と手本を使いながら、洗髪・体洗い・洗顔の流れを定着させる計画です。</p><div class="point"><strong>確認したいこと〈今回の整理〉</strong><br>前期B表が追加されたら、目標・手だて・評価を対応させて追記する。時計やタイマー等の成功記録も、観察時期を確認して扱う。</div><p><a href="#b">後期の寄宿舎計画を見る →</a></p></template>
<template id="b"><p class="eyebrow">03 / 寄宿舎 B表・後期</p><h1>伝えること、洗うこと。</h1><div class="notice">以下は後期の計画です。評価欄・総合所見は未記入です。</div><article class="card"><span class="tag">重点目標 1</span><h2 style="margin-top:0">PECSで自分の気持ちを伝える</h2><ul><li>「テレビ」「みたい」「おねがいします」等の語句を増やし、一緒に確認する。</li><li>やりたい時に仲間へ伝えられるよう、職員が言葉がけ・指さしをする。</li><li>共有の部屋では「いれて」、やり取りの後には「ありがとう」を支える。</li><li>仲間と話し合い、時間や約束をタイマー・ホワイトボードで示す。</li></ul><div class="point">確認ポイント〈整理〉：自分から伝えたか、どの援助があったか。相手の返事を待つことや、希望がかなわない時の代案も相談したい。</div></article><article class="card" style="margin-top:20px"><span class="tag">重点目標 2</span><h2 style="margin-top:0">手順表を見ながら体を洗う</h2><ul><li>イラスト・数字の手順表を作り、職員が手本を示して一緒に動作を確認する。</li><li>洗顔では「ジャブジャブ」と声をかける。</li><li>流れが定着したら、必要な声がけ・指さしで見守り、「オッケー」で区切る。</li><li>家庭へ手順表を渡し、連絡帳で双方の様子を共有する。</li></ul><div class="point">確認ポイント〈整理〉：洗う部位・動作・回数、必要な援助、苦手さや負担。家庭でも同じ手掛かりが使えるか。</div></article><p class="source">出典：S9。S8にも同じ重点目標2項目の記載。</p></template>
<template id="school"><p class="eyebrow">04 / 学校 B表②・後期</p><h1>学びの場面と、手掛かり</h1><article class="card"><span class="tag">長期目標〈計画〉</span><ol><li>PECSで相手に3語文で要求を伝える。</li><li>スケジュールに沿って活動を切り替えて行動する。</li></ol></article><div class="notice">評価欄は未記入。3語文や活動の達成を示す評価ではありません。</div><h2>日常生活</h2><ul><li><strong>身だしなみ：</strong>服装を整える。イラストと、手伝いを求めるPECSのチップを用意する。</li><li><strong>保健係：</strong>各教室へカードを配る。クラス表示を確認し、初めは職員が同行する。</li><li><strong>掃除：</strong>休み時間から切り替え、自分の範囲を雑巾がけする。タイマー、床のテープ、手本を使う。慣れたら本人のタイマー設定も支える。</li></ul><h2>学習・活動</h2><ul><li><strong>木工：</strong>したい活動を見つける。工程の異なる作業を選べるようにし、当日分をかごに用意する。</li><li><strong>調理の手順表づくり：</strong>活動を切り替え、印刷物の切り貼りで手順表を作る。</li><li><strong>キックベース：</strong>相手の陣地へ蹴る。手本と「3個蹴る」等の具体的回数を示す。</li><li><strong>リトミック：</strong>音楽に合わせて身体を動かし演奏する。歌と複数の楽器を用意する。</li><li><strong>調理実習：</strong>器具を正しく扱う。安全な使い方と工程を動画・イラスト・手本で示す。</li><li><strong>制作：</strong>紙や木を道具で加工する。複数の制作物と、手本・動画を用意する。</li><li><strong>作業：</strong>予定した内容に最後まで取り組む。やることリストと当日分の材料を提示する。</li><li><strong>学校行事：</strong>購入品を正しく渡す。品物をまとめるかごと安心できるグッズを用意する。</li><li><strong>宿泊学習：</strong>係の仕事に取り組む。役割を写真・文字・イラストで示す。</li><li><strong>自立活動：</strong>内容を理解して自発的に取り組む。スケジュール、手本、複数の選択肢を用意する。</li></ul><div class="point"><strong>見るポイント〈今回の整理〉</strong><br>自分で選ぶ／終わりと次が分かる／必要な時に助けを求める。活動ごとに支援がどれだけ必要だったかを見る。</div><p class="source">出典：S2・S3・S4。行事の固有名は省略・一般化しています。</p></template>
<template id="comments"><p class="eyebrow">05 / 保護者コメント案</p><h1>後期の計画へ添える言葉</h1><p class="lead">以下は今回作成した提案です。保護者が既に述べた意見や提出済みのコメントではありません。</p><h2>気持ちを伝える</h2><blockquote>やりたいことをPECSで伝える経験を増やしていただきたいです。「てつだって」「いやです」「やすみたい」など、困った時にも伝えられる方法をご相談したいです。相手の返事を待つことや、希望がかなわない時の別の方法も、分かりやすい提示で支えていただけるとありがたいです。</blockquote><h2>体洗い・家庭との共有</h2><blockquote>家庭でも取り組めるよう、同じ手順表と、洗う場所・動かし方・回数の目安を共有していただきたいです。本人の苦手さや様子を見ながら進め、どこを自分でできたか、どの支援が必要だったかを教えていただけると助かります。</blockquote><h2>学校・寄宿舎をつなぐ</h2><blockquote>学校と寄宿舎で使うカードや伝え方を共有し、本人から伝えた場合と、声がけや指さしがあって伝えた場合を分けて様子を教えていただきたいです。切り替えでは、終わりと次の活動が分かる提示をお願いします。</blockquote><p class="source">根拠：S2・S5・S7・S9。拒否や休憩の表出に困っていると原資料に書かれているわけではなく、支援の選択肢としての提案です。</p></template>
<template id="sources"><p class="eyebrow">06 / SOURCES</p><h1>出典と、読み分け</h1><h2>事実・見立て・提案を分ける</h2><ul><li>記載要約：資料で確認できた内容。現在の全ての場面での能力を保証するものではありません。</li><li>学校の見立て：「可能性の芽」「願い」「支援の方向」。成果とは区別します。</li><li>整理・確認ポイント：今回の解釈です。</li><li>コメント案：今回新たに作った提案です。</li></ul><h2>画像と文書の対応</h2><ul><li>S2：IMG_4852.jpg、S3：IMG_4853.jpg、S4：IMG_4854.jpg＝学校後期計画。</li><li>S5：IMG_4855.jpg、S6：IMG_4856.jpg、S7：IMG_4857.jpg＝A表と実態・願い。</li><li>S8：IMG_4858.jpg＝重点目標のみのページ。</li><li>S9：IMG_4859.jpg＝寄宿舎B表・後期。</li><li>S1：IMG_4851.jpg＝入舎希望申込書。Web版には詳細を掲載していません。</li></ul><div class="notice">前期B表の原本は未確認です。過去の会話の回答本文は取得できず、添付画像を根拠に再整理しました。原画像は個人情報を含むため掲載していません。</div><h2>掲載範囲</h2><p>氏名・学校名・所在地・生年月日・連絡先を省略し、生活の詳細な記録や申込書の情報も掲載していません。名前を除いても匿名性が保証されるわけではありません。詳細な生活記録と申込書は、このページの掲載対象に含めていません。</p></template>
<script>
const keys=['home','a','first','b','school','comments','sources'];
function render(){let id=location.hash.slice(1);if(!keys.includes(id))id='home';const main=document.getElementById('content');main.replaceChildren(document.getElementById(id).content.cloneNode(true));const foot=document.createElement('footer');foot.textContent='アカリン / 令和8年度 学びと生活の記録';main.append(foot);document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title=main.querySelector('h1').textContent+'｜アカリン';}window.addEventListener('hashchange',()=>{render();document.getElementById('content').focus();window.scrollTo(0,0)});render();
</script></body></html>
